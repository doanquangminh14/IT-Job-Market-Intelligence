project:
  name: it-job-market-intelligence

paths:
  raw: data/raw
  bronze: data/bronze
  silver: data/silver
  gold: data/gold
  logs: logs

ingestion:
  timeout_seconds: 30
  max_retries: 3
  backoff_seconds: 2
  rate_limit_per_second: 1
  user_agent: "it-job-market-intelligence/0.1 (student project)"

recommendation:
  # Baseline weights, sẽ được evaluation và tune ở Task 17
  content_weights:
    skill: 0.50
    semantic: 0.30
    experience: 0.10
    preference: 0.10
  hybrid_weights:
    content: 0.70
    cf: 0.30
  interaction_weights:
    view: 1
    click: 2
    save: 3
    apply: 5

sources:
  source_01_vietjobs:
    code: source_01
    name: VietJobs (Hugging Face dataset)
    access_method: dataset
    is_snapshot: true
    hf_repo_id: dinhieufam/VietJobs
    license_note: "TODO - verify on dataset card"
  source_02_arbeitnow:
    code: source_02
    name: Arbeitnow Job Board API
    access_method: api
    is_snapshot: false
    base_url: https://www.arbeitnow.com/api/job-board-api
    max_pages: 3
    license_note: "Public API, no key. Read arbeitnow.com terms before publishing data."