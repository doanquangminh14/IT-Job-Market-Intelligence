# =====================================================================================
# NHÓM NGHỀ CỦA TIN (notebook 06/01_simulation: chia nhóm người dùng mô phỏng; 02: thống kê theo nhóm)
# Gán nhóm theo TIÊU ĐỀ đã bỏ dấu và hạ chữ thường ('Hà Nội' ➔ 'ha noi'), nên từ khóa viết KHÔNG DẤU.
# Mỗi tin lấy nhóm khớp ĐẦU TIÊN theo thứ tự dưới đây: nhóm cụ thể đứng trước, nhóm chung chung đứng sau
# (vd. 'Game Tester' vào Game/Đồ họa chứ không vào QA/QC). Không khớp nhóm nào ➔ 'Khác'.
# Từ khóa là mẫu regex: \b = ranh giới từ, .? = có hoặc không có một ký tự.
# =====================================================================================

# Vị trí KINH DOANH trong công ty công nghệ (Sales phần mềm, Business Development...) ➔ luôn vào 'Khác'
non_tech_keywords:
  - 'kinh doanh'
  - 'sales'
  - 'business development'
  - 'presales'
  - 'telesales'
  - 'tu van ban hang'
  - 'account manager'
  - '\bbd\b'

domains:
  # Game Designer, Unity Developer, 2D Animator, 3D Artist, Game Tester
  - name: 'Game/Đồ họa'
    keywords:
      - 'game'
      - 'unity'
      - 'unreal'
      - 'animat'
      - '\brigg'
      - '\bspine\b'
      - '\bvfx\b'
      - 'concept artist'
      - 'pixel artist'
      - '3d model'
      - '\b[23]d\b.*\b(artist|animator|modeler|modeling)\b'
  # Tester, QA Engineer, Kiểm thử phần mềm
  - name: 'QA/QC'
    keywords:
      - '\bqa\b'
      - '\bqc\b'
      - 'test'
      - 'kiem thu'
      - 'chat luong'
      - 'quality'
  # Data Analyst, Data Engineer, AI Engineer, BI
  - name: 'Data/AI'
    keywords:
      - '\bdata\b'
      - '\bai\b'
      - 'machine learning'
      - '\bml\b'
      - '\bbi\b'
      - 'analytics'
      - 'du lieu'
      - 'scientist'
      - '\bnlp\b'
      - '\bllm\b'
      - 'computer vision'
  # Business Analyst, Product Owner, Project Manager, BrSE, Scrum Master
  - name: 'BA/Product/PM'
    keywords:
      - 'business analyst'
      - '\bba\b'
      - 'phan tich nghiep vu'
      - 'nghiep vu'
      - 'product owner'
      - 'product manager'
      - '\bpo\b'
      - '\bpm\b'
      - 'project manager'
      - 'quan ly du an'
      - 'scrum'
      - '\bbrse\b'
      - 'bridge'
      - 'comtor'
  # UI/UX Designer, UX Research
  - name: 'UI/UX'
    keywords:
      - 'ui/?ux'
      - 'ux/?ui'
      - '\bux\b'
      - '\bui\b'
  # Kỹ sư nhúng, Firmware, PLC, Phần cứng
  - name: 'Embedded/IoT'
    keywords:
      - 'nhung'
      - 'embedded'
      - 'firmware'
      - '\biot\b'
      - 'pcb'
      - 'vi xu ly'
      - 'vi dieu khien'
      - 'hardware'
      - 'phan cung'
      - 'fpga'
      - '\bplc\b'
      - 'tu dong hoa'
  # Frontend, React, Android, iOS, Flutter
