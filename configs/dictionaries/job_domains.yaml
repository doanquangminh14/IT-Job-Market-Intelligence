    keywords:
      - 'front.?end'
      - 'react'
      - 'angular'
      - '\bvue'
      - 'mobile'
      - '\bios\b'
      - 'android'
      - 'flutter'
      - 'swift'
      - 'kotlin'
      - 'web developer'
      - 'lap trinh web'
  # DevOps, Cloud, Quản trị hệ thống, Mạng, An ninh mạng
