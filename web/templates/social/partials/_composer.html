{# Ô viết bài. Stage 1: chỉ xem trước trên trình duyệt (social.js), không gửi lên server #}
{% if user.is_authenticated %}
  <form class="cm-card cm-composer" data-composer novalidate>
    <label for="composer-body" class="form-label fw-semibold">Chia sẻ với cộng đồng</label>
    <textarea id="composer-body" name="body" class="form-control" rows="3" maxlength="2000" required
              placeholder="Bạn đang học gì, làm gì, hay cần hỏi gì?"></textarea>
    <div class="d-flex flex-wrap gap-2 align-items-center mt-2">
      <label for="composer-tags" class="visually-hidden">Thẻ kỹ năng</label>
      <input id="composer-tags" name="tags" class="form-control form-control-sm cm-composer-tags" maxlength="100"
             placeholder="Thẻ, cách nhau bởi dấu phẩy: Python, SQL">
      <span class="small text-muted ms-auto" data-composer-count aria-live="polite">0/2000</span>
      <button type="submit" class="btn btn-brand btn-sm px-3">Đăng bài</button>
    </div>
  </form>
{% else %}
  <div class="cm-card d-flex flex-wrap align-items-center justify-content-between gap-2">
    <span>Đăng nhập để đăng bài, bình luận và theo dõi thành viên.</span>
    <span class="d-flex gap-2">
      <a class="btn btn-brand btn-sm px-3" href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}">Đăng nhập</a>
      <a class="btn btn-outline-brand btn-sm px-3" href="{% url 'accounts:register' %}">Đăng ký</a>
    </span>
  </div>
{% endif %}
