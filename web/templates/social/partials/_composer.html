{# Ô viết bài. Biến: post_max #}
{% if user.is_authenticated %}
  <form method="post" action="{% url 'community:create' %}" class="cm-card cm-composer" data-composer>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="composer-body" class="form-label fw-semibold">Chia sẻ với cộng đồng</label>
    <textarea id="composer-body" name="body" class="form-control" rows="3" maxlength="{{ post_max }}" required
              placeholder="Bạn đang học gì, làm gì, hay cần hỏi gì?"></textarea>
    <div class="d-flex flex-wrap gap-2 align-items-center mt-2">
      <label for="composer-tags" class="visually-hidden">Chủ đề (kỹ năng)</label>
      <input id="composer-tags" name="tags" class="form-control form-control-sm cm-composer-tags" maxlength="200"
             placeholder="Chủ đề, cách nhau dấu phẩy: Python, SQL">
      <span class="small text-muted ms-auto" data-composer-count aria-live="polite">0/{{ post_max }}</span>
      <button type="submit" class="btn btn-brand btn-sm px-3">Đăng bài</button>
    </div>
    <p class="small text-muted mb-0 mt-1">Chủ đề phải là kỹ năng có trong hệ thống (tối đa 5).</p>
  </form>
{% else %}
  <div class="cm-card d-flex flex-wrap align-items-center justify-content-between gap-2">
    <span>Đăng nhập để đăng bài, bình luận và theo dõi thành viên.</span>
    <span class="d-flex gap-2">
      <a class="btn btn-brand btn-sm px-3" href="{% url 'accounts:login' %}?next={{ request.get_full_path|urlencode }}">Đăng nhập</a>
      <a class="btn btn-outline-brand btn-sm px-3" href="{% url 'accounts:register' %}">Đăng ký</a>
    </span>
  </div>
{% endif %}
