{# Khuôn HTML cho bài viết / bình luận xem trước. social.js chỉ điền bằng textContent (không innerHTML) #}
<template id="tpl-post">
  <article class="cm-card cm-preview" data-post data-author="">
    <header class="d-flex align-items-center gap-2 mb-2">
      <span class="cm-avatar" aria-hidden="true" data-slot="initials"></span>
      <div>
        <span class="fw-semibold" data-slot="username"></span>
        <div class="small text-muted">Vừa xong · <span class="cm-badge-demo">Chưa lưu</span></div>
      </div>
    </header>
    <p class="cm-body mb-2" data-slot="body"></p>
    <div class="d-flex flex-wrap gap-1" data-slot="tags"></div>
  </article>
</template>
<template id="tpl-comment">
  <div class="cm-comment cm-preview">
    <span class="cm-avatar cm-avatar-sm" aria-hidden="true" data-slot="initials"></span>
    <div>
      <div class="small"><span class="fw-semibold" data-slot="username"></span> <span class="text-muted">· Vừa xong · <span class="cm-badge-demo">Chưa lưu</span></span></div>
      <p class="mb-0 cm-body" data-slot="body"></p>
    </div>
  </div>
</template>
